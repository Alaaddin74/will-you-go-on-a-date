<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Date Invitation ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    overflow:hidden;
}

.container{
    background:white;
    padding:40px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
    max-width:500px;
    width:90%;
}

h1{
    color:#ff4f81;
    margin-bottom:20px;
}

p{
    font-size:18px;
    margin-bottom:25px;
}

.buttons{
    position:relative;
    height:120px;
}

button{
    border:none;
    border-radius:10px;
    padding:12px 28px;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

#yesBtn{
    background:#4CAF50;
    color:white;
    margin-right:15px;
}

#yesBtn:hover{
    transform:scale(1.05);
}

#noBtn{
    background:#f44336;
    color:white;
}

.popup{
    display:none;
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 0 30px rgba(0,0,0,0.3);
    text-align:center;
    z-index:9999;
}

.popup h2{
    margin-bottom:10px;
}

.popup button{
    margin-top:15px;
    background:#ff4f81;
    color:white;
}

.back-btn{
    background:#ff4f81;
    color:white;
    margin-top:20px;
}
</style>
</head>

<body>

<div class="container" id="container">

    <h1>❤️ Date Invitation ❤️</h1>

    <p>
        Would you like to go on a date with me? 🥰
    </p>

    <div class="buttons">
        <button id="yesBtn">Yes ❤️</button>
        <button id="noBtn">No 😢</button>
    </div>

</div>

<div class="popup" id="popup">

    <h2>🤨 Are you kidding me?</h2>

    <p>
        You tried pressing "No" too many times! 😂
    </p>

    <button onclick="closePopup()">
        Sorry 😅
    </button>

</div>

<script>

const container = document.getElementById("container");

let noAttempts = 0;

const originalPage = `
<h1>❤️ Date Invitation ❤️</h1>

<p>
Would you like to go on a date with me? 🥰
</p>

<div class="buttons">
    <button id="yesBtn">Yes ❤️</button>
    <button id="noBtn">No 😢</button>
</div>
`;

function initializeButtons(){

    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");

    yesBtn.addEventListener("click", showSuccessPage);

    noBtn.addEventListener("mouseenter", moveNoButton);
    noBtn.addEventListener("click", moveNoButton);
}

function moveNoButton(){

    noAttempts++;

    const noBtn = document.getElementById("noBtn");

    const maxX = window.innerWidth - 150;
    const maxY = window.innerHeight - 80;

    const randomX = Math.random() * maxX;
    const randomY = Math.random() * maxY;

    noBtn.style.position = "fixed";
    noBtn.style.left = randomX + "px";
    noBtn.style.top = randomY + "px";

    if(noAttempts >= 5){
        document.getElementById("popup").style.display = "block";
    }
}

function closePopup(){
    document.getElementById("popup").style.display = "none";
}

function showSuccessPage(){

    container.innerHTML = `
        <h1>❤️ Thank You ❤️</h1>

        <p>
            I'm so happy you said YES! 🥰
        </p>

        <p>
            I'll inform you later about the date details ✨
        </p>

        <button class="back-btn" onclick="goBack()">
            ⬅ Back
        </button>
    `;
}

function goBack(){

    container.innerHTML = originalPage;

    initializeButtons();
}

initializeButtons();

</script>

</body>
</html>
